<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cart &amp; Keep Emails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,650;112,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3eee5; --panel: #faf6ef; --card: #ffffff; --line: #e3dace; --ink: #2a2723;
    --soft: #55504a; --faint: #857d70; --sage: #5e7359; --sage-wash: #eef2ec;
    --terra: #ba5a3d; --terra-text: #ad5438; --sel: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1a17; --panel: #24211d; --card: #2c2924; --line: #3a3630; --ink: #f1ece4;
      --soft: #c9c1b5; --faint: #9a9185; --sage: #9db396; --sage-wash: #2f3a2c;
      --terra: #d4775a; --terra-text: #e08b6f; --sel: #2f2b26;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1a17; --panel: #24211d; --card: #2c2924; --line: #3a3630; --ink: #f1ece4;
    --soft: #c9c1b5; --faint: #9a9185; --sage: #9db396; --sage-wash: #2f3a2c;
    --terra: #d4775a; --terra-text: #e08b6f; --sel: #2f2b26;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.5 Inter, system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 340px 1fr; min-height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; overflow: auto; }
  .brand { padding: 22px 20px 14px; }
  .brand h1 { margin: 0; font: 700 20px/1.2 Archivo, Helvetica, sans-serif; font-stretch: 112%; letter-spacing: -0.01em; }
  .brand p { margin: 6px 0 0; color: var(--faint); font-size: 13px; }
  .group { margin: 14px 20px 6px; font: 700 11px/1 Inter, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); }
  .mail { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; cursor: pointer;
    padding: 11px 20px 12px; border-left: 3px solid transparent; }
  .mail:hover { background: color-mix(in srgb, var(--sel) 60%, transparent); }
  .mail[aria-current="true"] { background: var(--sel); border-left-color: var(--terra); }
  .mail .top { display: flex; justify-content: space-between; gap: 10px; }
  .mail .to { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail .when { color: var(--faint); font-size: 12px; white-space: nowrap; }
  .mail .subject { margin-top: 2px; font-weight: 500; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mail .pre { color: var(--faint); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  main { min-width: 0; padding: 20px 24px 60px; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 0 auto 14px; max-width: 760px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; background: none; color: var(--soft); font: 500 13px/1 Inter, sans-serif; padding: 9px 14px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .note { color: var(--faint); font-size: 12px; margin-left: auto; }
  .head { max-width: 760px; margin: 0 auto 14px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
  .head .subj { margin: 0; font: 700 18px/1.3 Archivo, Helvetica, sans-serif; font-stretch: 112%; }
  .head .meta { margin: 6px 0 0; color: var(--soft); font-size: 13px; }
  .head .meta b { color: var(--ink); font-weight: 600; }
  .head .trig { margin: 10px 0 0; padding: 8px 12px; border-radius: 8px; background: var(--sage-wash); color: var(--ink); font-size: 13px; }
  .stage { display: flex; justify-content: center; }
  .frame { width: 680px; max-width: 100%; transition: width .25s ease; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: #faf6ef; }
  .frame[data-w="375"] { width: 375px; border-radius: 28px; border-width: 8px; border-color: var(--ink); }
  iframe { display: block; width: 100%; border: 0; height: 900px; background: #faf6ef; }
  .menu { display: none; }
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    aside { position: static; height: auto; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
    aside[data-closed] .list { display: none; }
    .menu { display: inline-flex; }
    main { padding: 16px 16px 48px; }
    .note { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <div class="brand">
      <h1>Cart &amp; Keep emails</h1>
      <p>Every email the shop sends, rendered from the templates the functions use, with sample data.</p>
    </div>
    <div class="list" id="list"></div>
  </aside>
  <main>
    <div class="bar">
      <div class="seg menu"><button type="button" id="menuBtn" aria-pressed="false">All emails</button></div>
      <div class="seg" role="group" aria-label="Width">
        <button type="button" data-w="680" aria-pressed="true">Desktop</button>
        <button type="button" data-w="375" aria-pressed="false">Phone</button>
      </div>
      <div class="seg" role="group" aria-label="Fonts">
        <button type="button" data-f="brand" aria-pressed="true">Apple Mail fonts</button>
        <button type="button" data-f="gmail" aria-pressed="false">Gmail fonts</button>
      </div>
      <span class="note">Gmail and Outlook drop web fonts, so the Gmail view shows Helvetica and Arial.</span>
    </div>
    <div class="head" id="head"></div>
    <div class="stage"><div class="frame" id="frame" data-w="680"><iframe id="view" title="Email preview"></iframe></div></div>
  </main>
</div>
<script>
const DATA = /*DATA*/null;
const state = { i: 0, w: 680, f: 'brand' };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const htmlOf = (t) => {
  let h = t.html.replace(/%%IMG(\d+)%%/g, (_, n) => DATA.pool[n]);
  if (state.f === 'gmail') h = h.replace(/<link href="https:\/\/fonts\.googleapis[^>]*>/, '').replace(/'Archivo',|'Inter',/g, '');
  return h;
};

function list() {
  const el = document.getElementById('list');
  let group = '';
  el.innerHTML = DATA.emails.map((t, i) => {
    const g = t.group !== group ? `<p class="group">${esc(group = t.group)}</p>` : '';
    return `${g}<button type="button" class="mail" data-i="${i}" aria-current="${i === state.i}">
      <span class="top"><span class="to">${esc(t.to)}</span><span class="when">${esc(t.when)}</span></span>
      <span class="subject" style="display:block">${esc(t.subject)}</span>
      <span class="pre">${esc(t.preheader)}</span></button>`;
  }).join('');
}

function show() {
  const t = DATA.emails[state.i];
  document.querySelectorAll('.mail').forEach((b) => b.setAttribute('aria-current', String(+b.dataset.i === state.i)));
  document.getElementById('head').innerHTML = `<p class="subj">${esc(t.subject)}</p>
    <p class="meta"><b>Cart &amp; Keep</b> &lt;notify@relay.cartandkeep.com&gt; to ${esc(t.to)}</p>
    <p class="trig">${esc(t.trigger)}</p>`;
  const frame = document.getElementById('frame');
  frame.dataset.w = state.w;
  const view = document.getElementById('view');
  const fit = () => { try { const d = view.contentDocument; view.style.height = '200px'; view.style.height = Math.max(d.body.scrollHeight, d.documentElement.scrollHeight) + 'px'; } catch (e) {} };
  view.onload = () => { fit(); setTimeout(fit, 500); };
  view.srcdoc = htmlOf(t);
}

document.addEventListener('click', (e) => {
  const m = e.target.closest('.mail');
  if (m) { state.i = +m.dataset.i; show(); if (matchMedia('(max-width: 860px)').matches) document.getElementById('side').setAttribute('data-closed', ''); window.scrollTo(0, 0); return; }
  const w = e.target.closest('[data-w]');
  if (w && w.tagName === 'BUTTON') { state.w = +w.dataset.w; document.querySelectorAll('button[data-w]').forEach((b) => b.setAttribute('aria-pressed', String(b === w))); show(); return; }
  const f = e.target.closest('[data-f]');
  if (f) { state.f = f.dataset.f; document.querySelectorAll('[data-f]').forEach((b) => b.setAttribute('aria-pressed', String(b === f))); show(); return; }
  if (e.target.closest('#menuBtn')) document.getElementById('side').toggleAttribute('data-closed');
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  if (!e.target.closest('.mail')) return;
  e.preventDefault();
  state.i = Math.max(0, Math.min(DATA.emails.length - 1, state.i + (e.key === 'ArrowDown' ? 1 : -1)));
  show(); document.querySelector(`.mail[data-i="${state.i}"]`).focus();
});
if (matchMedia('(max-width: 860px)').matches) document.getElementById('side').setAttribute('data-closed', '');
list(); show();
</script>
</body>
</html>
